# Tertic - Optimized Termux Configuration for AI Agents
# Place this file in ~/.termux/termux.properties

# Terminal settings
allow-external-apps = true
# Enforce Chararacter Class
enforce-char-class = true

# Extra keys (easier keyboard access)
extra-keys = [[ESC, TAB, CTRL, ALT, '-', '/', HOME, UP, END, DOWN]]

# Terminal bell
terminal-bell-style = none

# Cursor style
cursor-style = block

# Font size (adjust based on your screen)
font-size = 10

# Keep screen on while using Termux
wake-lock = true

# Shared Termux storage
shared-termux-storage = true

# Use termux-exec wrapper
use-termux-exec = true
